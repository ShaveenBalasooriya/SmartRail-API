schema: spec-driven

# Project context: constraints an agent cannot infer by reading the code.
context: |
  SmartRail-API is the backend for SmartRail MVP 1, a single source of truth for live train running on
  a two-line, nine-station network. The planning documents live in the sibling docs repository:
  ../docs/scoping/mvp-1-scope.md (scope and epics), ../docs/architecture.md (architecture decisions),
  ../docs/data-model.md (tables) and ../docs/user-journeys/ (user stories with IDs such as NC-03,
  GRD-07, CAT-05, PAX-02, AUD-05). Where these disagree with a change's specs, the specs win and the
  disagreement must be raised with the owner.
  MVP 1 roles: Network Controller, Guard and Auditor (staff, seeded accounts); anonymous passengers;
  one catering provider as a machine client with an API key. Scheduler, Driver, System Admin,
  passenger accounts, notices to crew and skipped-stop changes are deferred and must not be built.
  Early termination is in MVP 1 (owner decision 2026-10-21), limited to the Network Controller ending
  a running journey that cannot continue.
  Stack: .NET 10, ASP.NET Core Minimal APIs (no MVC controllers), PostgreSQL, EF Core, MediatR,
  Server-Sent Events, Authentik (OIDC) for staff identity, Sentry, Docker Compose, xUnit and
  Testcontainers.
  Architecture: modular monolith with six modules (Identity & Access, Rail Network, Live Operations,
  Distribution, Catering Integration, Audit). Each module has four projects, Domain, Application,
  Infrastructure and Api (Carter endpoints), plus a Contracts project for its public events and
  query interfaces (docs/architecture.md section 2). Domain and Application never reference EF Core,
  HTTP or Authentik, and Api never references Infrastructure. The Shared Kernel is three projects
  (SharedKernel, SharedKernel.Application, SharedKernel.Api), plus SharedKernel.Infrastructure for the
  event bus once add-event-bus lands. Each module that keeps data owns one
  PostgreSQL schema and one DbContext. No foreign key and no query crosses a schema boundary;
  modules interact only through in-process query contracts, MediatR notifications inside a module,
  and the event bus for cross-module events (owner decision 2026-10-21): a publisher saves an outbox row
  in its own schema with the change, a dispatcher delivers it at least once to consumers, and there is no
  message broker in MVP 1 (NATS JetStream is expected later as a transport swap; add-event-bus).
  A staff member's role is assigned as an Authentik group and read from the token's groups claim
  (exactly one of network_controller, guard, auditor; none or several means no role). SmartRail still
  owns the role catalogue, the role check on every endpoint, the seeded staff record and the audited
  denial event (docs/architecture.md section 5). No passenger personal data, token, API key or
  client IP address is ever written to a log or to the audit record.
  Workflow: stacked pull requests with Graphite, trunk dev; main only receives promotions from dev.

rules:
  proposal:
    - Include an Out of Scope section listing what this change deliberately does not build
    - Name the epic and the user-story IDs from ../docs/user-journeys that the change delivers
  specs:
    - Every requirement must trace to a story ID, an epic or an architecture decision; cite it in the requirement text
    - Keep scenarios to the main behaviour and the edge cases a story or the scope names; do not invent extra edge cases
    - Do not specify defensive hardening, caching or resilience that no story, epic or architecture decision asks for
    - Mark anything inferred rather than found in the planning documents with [A]
  tasks:
    - Size each task group so it can land as one reviewable stacked pull request
    - The default verification is a clean build and running the application; name it as such
    - Ask for an automated test only for domain rules, a genuinely risky integration point, or one of the five end-to-end flows, and never one test per scenario
    - Create a module's projects, migrations and wiring in the change that first needs them, not in advance

operations:
  apply:
    guidance:
      - Treat the change's specs as the single source of truth and do not implement any requirement that is not listed
      - Build the simplest thing that satisfies the requirement; do not add tests, checks, abstractions or hardening the task does not ask for
      - Before writing code, restate the acceptance criteria (the requirements and scenarios) and confirm your understanding with the owner
      - Raise any conflict between the specs and the planning documents instead of resolving it silently
  archive:
    guidance:
      - Confirm every task is checked and the change validates with openspec validate --strict before archiving
