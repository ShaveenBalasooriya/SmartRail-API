name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# One run per branch: a new push cancels the previous, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # The SDK version comes from global.json; this enables the cached install.
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore SmartRail.sln

      - name: Build
        # Warnings are errors in Directory.Build.props; this makes the intent explicit in CI.
        run: dotnet build SmartRail.sln --configuration Release --no-restore -warnaserror

      - name: Test
        # The integration tests use Testcontainers, which needs the Docker daemon that the
        # ubuntu-latest runner provides.
        run: dotnet test SmartRail.sln --configuration Release --no-build --verbosity normal
