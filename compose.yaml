# The local MVP 1 stack: the API, its PostgreSQL, and Authentik with the services it needs
# (design D6). Authentik follows the owner's own compose layout: one PostgreSQL, a server and a
# worker, and no Redis. The simulated catering provider is added by add-catering-integration.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up --build
#
# The API is reachable on http://localhost:5080 once /health/ready answers 200.

name: smartrail

services:
  api-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrail}
      POSTGRES_USER: ${POSTGRES_USER:-smartrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - api-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartrail} -d ${POSTGRES_DB:-smartrail}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: "Host=api-db;Port=5432;Database=${POSTGRES_DB:-smartrail};Username=${POSTGRES_USER:-smartrail};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Cors__AllowedOrigins__0: ${OPERATIONS_WEB_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${PASSENGER_WEB_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__2: ${STATION_DISPLAY_ORIGIN:-http://localhost:8081}
      Documentation__Enabled: ${DOCUMENTATION_ENABLED:-true}
      # Staff tokens come from Authentik. Inside Compose the discovery document and signing
      # keys are fetched over the container network, while the issuer is the URL the token
      # was requested with (the public one).
      Authentication__Staff__MetadataAddress: http://authentik-server:9000/application/o/smartrail-staff/.well-known/openid-configuration
      Authentication__Staff__ValidIssuer: "${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}/application/o/smartrail-staff/"
      Authentication__Staff__Audience: smartrail-staff
      # The browser-facing Authentik endpoints the OpenAPI OAuth2 scheme and Scalar use.
      # They are the public URLs because the browser, not the container, calls them.
      Authentication__Staff__AuthorizationUrl: "${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}/application/o/authorize/"
      Authentication__Staff__TokenUrl: "${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}/application/o/token/"
      # The catering provider's API key, stored as a hash by the Identity seeder.
      Catering__ProviderApiKey: "${CATERING_PROVIDER_API_KEY:?CATERING_PROVIDER_API_KEY is required}"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      api-db:
        condition: service_healthy
    restart: unless-stopped

  # --- Simulated catering provider ------------------------------------------
  # A separate system that registers a webhook and applies what SmartRail pushes. It keeps its
  # state in memory and reaches the API over the Compose network, never through the database.
  simulated-provider:
    build:
      context: .
      dockerfile: src/SmartRail.SimulatedProvider/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # The API's service name inside Compose, and the same dev key the API stores a hash of.
      SMARTRAIL_BASE_URL: http://api:8080
      SMARTRAIL_API_KEY: "${CATERING_PROVIDER_API_KEY:?CATERING_PROVIDER_API_KEY is required}"
      SIMULATED_PROVIDER_CALLBACK_URL: http://simulated-provider:8080/webhook
      SIMULATED_PROVIDER_STATION_ID: ${SIMULATED_PROVIDER_STATION_ID:-04624d0f-9410-72e3-967f-501ed71f2441}
    ports:
      - "${SIMULATED_PROVIDER_PORT:-5081}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # --- Authentik -------------------------------------------------------------
  # Its own PostgreSQL (authentik-db); the API never depends on these services.

  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS is required}
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?PG_PASS is required}
      # App passwords for the three seeded staff users, read by the blueprint below.
      SMARTRAIL_CONTROLLER_APP_PASSWORD: ${SMARTRAIL_CONTROLLER_APP_PASSWORD:?SMARTRAIL_CONTROLLER_APP_PASSWORD is required}
      SMARTRAIL_GUARD_APP_PASSWORD: ${SMARTRAIL_GUARD_APP_PASSWORD:?SMARTRAIL_GUARD_APP_PASSWORD is required}
      SMARTRAIL_AUDITOR_APP_PASSWORD: ${SMARTRAIL_AUDITOR_APP_PASSWORD:?SMARTRAIL_AUDITOR_APP_PASSWORD is required}
      # Sign-in passwords for the three seeded staff users, read by the blueprint below.
      SMARTRAIL_CONTROLLER_LOGIN_PASSWORD: ${SMARTRAIL_CONTROLLER_LOGIN_PASSWORD:?SMARTRAIL_CONTROLLER_LOGIN_PASSWORD is required}
      SMARTRAIL_GUARD_LOGIN_PASSWORD: ${SMARTRAIL_GUARD_LOGIN_PASSWORD:?SMARTRAIL_GUARD_LOGIN_PASSWORD is required}
      SMARTRAIL_AUDITOR_LOGIN_PASSWORD: ${SMARTRAIL_AUDITOR_LOGIN_PASSWORD:?SMARTRAIL_AUDITOR_LOGIN_PASSWORD is required}
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    depends_on:
      authentik-db:
        condition: service_healthy
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./deploy/authentik/blueprints:/blueprints/custom

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    command: worker
    environment: *authentik-environment
    depends_on:
      authentik-db:
        condition: service_healthy
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./deploy/authentik/blueprints:/blueprints/custom

volumes:
  api-db-data:
  authentik-db-data:
    driver: local
