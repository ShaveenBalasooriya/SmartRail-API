# The local MVP 1 stack: the API, its PostgreSQL, and Authentik with the services it needs
# (design D6). Authentik follows the owner's own compose layout: one PostgreSQL, a server and a
# worker, and no Redis. The simulated catering provider is added by add-catering-integration.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up --build
#
# The API is reachable on http://localhost:5080 once /health/ready answers 200.

name: smartrail

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrail}
      POSTGRES_USER: ${POSTGRES_USER:-smartrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartrail} -d ${POSTGRES_DB:-smartrail}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-smartrail};Username=${POSTGRES_USER:-smartrail};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Cors__AllowedOrigins__0: ${OPERATIONS_WEB_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${PASSENGER_WEB_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__2: ${STATION_DISPLAY_ORIGIN:-http://localhost:8081}
      Documentation__Enabled: ${DOCUMENTATION_ENABLED:-true}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Authentik -------------------------------------------------------------
  # Its own PostgreSQL; the API never depends on these services.

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS is required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?PG_PASS is required}
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    command: worker
    environment: *authentik-environment
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates

volumes:
  postgres-data:
  database:
    driver: local
